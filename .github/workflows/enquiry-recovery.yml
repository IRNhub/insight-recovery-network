name: Website enquiry recovery check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-enquiry-recovery
  cancel-in-progress: false

jobs:
  wake-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the existing API and verify health
        # The API starts its persisted enquiry worker whenever an Autoscale
        # instance wakes. Normal enquiry requests also start delivery immediately.
        # No enquiry contents or administrative credentials enter this workflow.
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 10 \
            --connect-timeout 15 --max-time 45 \
            https://www.insightrecoverynetwork.com/api/healthz
