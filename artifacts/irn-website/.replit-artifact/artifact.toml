kind = "web"
previewPath = "/"
title = "Insight Recovery Network"
version = "1.0.0"
id = "artifacts/irn-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18088

[services.development]
run = "pnpm --filter @workspace/irn-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/irn-website", "run", "build" ]
publicDir = "artifacts/irn-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18088"
BASE_PATH = "/"
