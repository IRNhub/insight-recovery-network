kind = "web"
previewPath = "/"
title = "Insight Recovery Network"
version = "1.0.0"
id = "artifacts/irn-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18088

[services.development]
run = "pnpm --filter @workspace/irn-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/irn-website", "run", "build" ]
publicDir = "artifacts/irn-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/resources/why-cant-i-stop-how-addiction-works"
to = "/resources/why-cant-i-stop-how-addiction-works.html"

[[services.production.rewrites]]
from = "/resources/understanding-alcohol-dependency"
to = "/resources/understanding-alcohol-dependency.html"

[[services.production.rewrites]]
from = "/resources/what-happens-in-residential-rehabilitation"
to = "/resources/what-happens-in-residential-rehabilitation.html"

[[services.production.rewrites]]
from = "/resources/managing-relapse-part-of-recovery"
to = "/resources/managing-relapse-part-of-recovery.html"

[[services.production.rewrites]]
from = "/resources/supporting-a-loved-one-through-recovery"
to = "/resources/supporting-a-loved-one-through-recovery.html"

[[services.production.rewrites]]
from = "/resources/mental-health-and-addiction"
to = "/resources/mental-health-and-addiction.html"

[[services.production.rewrites]]
from = "/resources/online-recovery-programmes"
to = "/resources/online-recovery-programmes.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18088"
BASE_PATH = "/"
