kind = "web"
  previewPath = "/"
  title = "Insight Recovery Network"
  version = "1.0.0"
  id = "artifacts/irn-website"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 18088

  [services.development]
  run = "pnpm --filter @workspace/irn-website run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/irn-website", "run", "build" ]

  # Run the production web service so host-level canonical redirects and
  # response middleware execute. Static serving bypasses Vite middleware and
  # caused the bare domain to return 200 before the client redirected to www.
  [services.production.run]
  args = [ "pnpm", "--filter", "@workspace/irn-website", "run", "serve" ]

  [services.production.run.env]
  NODE_ENV = "production"
  PORT = "18088"

