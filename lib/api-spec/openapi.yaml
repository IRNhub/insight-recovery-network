openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Contact enquiry operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      summary: Submit a contact enquiry
      description: Atomically stores an enquiry and queues delivery. Reusing an unchanged submissionId returns the original receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "200":
          description: Original receipt for an unchanged retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreated"
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreated"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          maxLength: 254
          description: Required and validated as an email address when preferredContact is email; otherwise may be empty.
        phone:
          type: string
          maxLength: 35
          description: Required for phone or WhatsApp; 7 to 15 digits with common phone punctuation.
        preferredContact:
          type: string
          enum: [email, phone, whatsapp]
        supportType:
          type: string
          enum: [myself, someone-else, professional, general]
        serviceInterest:
          type: string
          enum: [treatment-placement, online-programme, family-support, free-assessment, insight-os, professional, not-sure]
        message:
          type: string
          maxLength: 2400
        submissionId:
          type: string
          format: uuid
          description: Reuse for an unchanged request after an uncertain response.
        consent:
          type: boolean
          enum: [true]
      required:
        - name
        - preferredContact
        - supportType
        - serviceInterest
        - consent
    EnquiryCreated:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - createdAt
    ValidationError:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
      required:
        - error
